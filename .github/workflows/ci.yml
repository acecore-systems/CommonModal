name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  spigot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v5.6.0
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: Spigot/pom.xml

      - name: Build Spigot plugin
        run: mvn -B -ntp -f Spigot/pom.xml verify

  fabric:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fabric
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v5.6.0
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6.2.0
        with:
          gradle-version: "9.6.1"

      - name: Build Fabric mod
        run: gradle --no-daemon build
