version: 2

updates:
  - package-ecosystem: maven
    directory: /Spigot
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Asia/Tokyo
    groups:
      maven-dependencies:
        patterns:
          - "*"

  - package-ecosystem: gradle
    directory: /fabric
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Asia/Tokyo
    groups:
      gradle-dependencies:
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Asia/Tokyo
    groups:
      actions:
        patterns:
          - "*"
